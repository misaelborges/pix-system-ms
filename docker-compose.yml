version: '3.8'
services:
  postgres-auth:
    image: postgres:15
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"

  postgres-account:
    image: postgres:15
    environment:
      POSTGRES_DB: account_db
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"

  postgres-pixkey:
    image: postgres:15
    environment:
      POSTGRES_DB: pixkey_db
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"

  postgres-receipt:
    image: postgres:15
    environment:
      POSTGRES_DB: receipt_db
      POSTGRES_PASSWORD: secret
    ports:
      - "5435:5432"

  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
    ports:
      - "27017:27017"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    ports:
      - "5672:5672"
      - "15672:15672"